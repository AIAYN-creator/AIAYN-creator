name: refresh profile

# Rebuilds the SVGs with fresh commit counts.
# Runs every day, on every push to main, and by hand from the Actions tab.
on:
  schedule:
    - cron: "17 4 * * *"
  push:
    branches: [main]
    paths-ignore: ["assets/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild SVGs
        env:
          # Public data only, on purpose. A repo it can't read keeps its last value.
          GH_TOKEN: ${{ github.token }}
        run: python tools/build_svgs.py --refresh
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || { git commit -m "Refresh profile numbers" && git push; }
